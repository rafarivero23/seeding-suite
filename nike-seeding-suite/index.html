<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nike Seeding Suite</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --black:#111;--ink:#111;--ink2:#4a4a4a;--mute:#8a8a8a;--line:#e3e3e3;--line2:#cfcfcf;
  --bg:#fff;--tile:#f5f5f5;--tile2:#ededed;--soft:#fafafa;
  --font:"Helvetica Neue Display","Helvetica Neue","HelveticaNeue",Helvetica,"Inter Tight",Arial,sans-serif;
  --r:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
.hidden{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:60px;padding:0 24px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:700;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
a.brand{text-decoration:none;color:inherit;align-items:center}
.logo-swoosh{height:44px;width:auto}
.logo-word{height:32px;width:auto}
.hero{display:flex;align-items:center;justify-content:center;gap:28px;padding:26px 0 6px}
.hero-word{width:min(560px,70vw);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.10));cursor:pointer}
.hero-word.hero-sm{width:260px}
.tape-logo{position:relative;display:block}
.tape-logo .tl{position:absolute}
.tape-logo img{position:absolute;inset:0;width:100%;height:100%;display:block}
.tape-logo .ts{-webkit-clip-path:var(--a);clip-path:var(--a);animation:tapeIn 240ms cubic-bezier(.3,.7,.2,1) both}
.tape-logo .tf{opacity:0;animation:tapeFill 220ms ease-out both}
@keyframes tapeIn{from{-webkit-clip-path:var(--a);clip-path:var(--a)}to{-webkit-clip-path:var(--b);clip-path:var(--b)}}
@keyframes tapeFill{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.tape-logo .ts,.tape-logo .tf{animation-duration:1ms}}
.brand span{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink2);text-decoration:none;border-radius:999px;letter-spacing:.01em}
.nav a.on{background:var(--black);color:#fff}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.lang button{padding:6px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.lang button.on{background:var(--black);color:#fff}
.sync{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sync.ok{background:var(--black)}

/* General */
.wrap{padding:28px 24px 80px;max-width:1500px;margin:0 auto}
h1{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1}
h2{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;background:var(--black);color:#fff;font-weight:500;font-size:14px;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{background:var(--line2);color:#fff;cursor:not-allowed;opacity:1}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--black);opacity:1}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.xs{height:28px;padding:0 11px;font-size:12px}
.btn.block{width:100%}
.link{text-decoration:underline;text-underline-offset:3px;color:var(--ink2);font-size:13px}
.input,select.input,textarea.input{height:42px;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;background:#fff;width:100%;outline:none}
textarea.input{height:auto;padding:10px 12px;min-height:80px}
.input:focus{border-color:var(--black)}
.input.sm{height:32px;padding:0 8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--black);border-color:var(--black);color:#fff}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.badge.solid{background:var(--black);color:#fff;border-color:var(--black)}
.badge.grey{background:var(--tile2);border-color:var(--tile2)}
.badge.faint{color:var(--mute);border-style:dashed}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
.card{border:1px solid var(--line);border-radius:4px;background:#fff}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.sep{height:1px;background:var(--line);margin:18px 0}

/* Product image tile */
.ph{position:relative;background:var(--tile);aspect-ratio:1/1;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ph .glyph{width:38%;opacity:.28}
.ph .glyph svg{width:100%;height:auto}
.ph .skutag{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.08em;color:var(--mute)}

/* Guest picker */
.picker-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:24px 0 28px;flex-wrap:wrap}
.guest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gtile{text-align:left;padding:20px;border:1px solid var(--line);border-radius:4px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .15s}
.gtile:hover{border-color:var(--black)}
.gtile .n{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.gtile.done{opacity:.45}

/* Shop layout */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 61px)}
.shop-main{padding:22px 24px 120px;min-width:0}
.shop-side{border-left:1px solid var(--line);background:var(--soft);position:sticky;top:61px;height:calc(100vh - 61px);display:flex;flex-direction:column}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.alloc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.alloc .a{border:1px solid var(--line);border-radius:4px;padding:8px 12px;min-width:96px}
.alloc .a .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.alloc .a .v{font-size:18px;font-weight:600;letter-spacing:-.02em}
.alloc .a.full{background:var(--black);color:#fff;border-color:var(--black)}
.alloc .a.full .k{color:#bbb}
.allow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.allow.compact{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin:0}
.al{border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.al.full{background:var(--black);border-color:var(--black);color:#fff}
.al-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.al .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--mute)}
.al .left{font-size:11px;font-weight:600}
.al.full .k{color:#aaa}
.al-mid{margin-top:4px}.al-mid b{font-size:24px;font-weight:700;letter-spacing:-.03em}.al-mid span{font-size:12px;color:var(--mute)}
.al.full .al-mid span{color:#bbb}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--black)}
.al.full .dots i{background:#555}.al.full .dots i.on{background:#fff}
.al-sub{font-size:11px;color:var(--mute);margin-top:6px}.al.full .al-sub{color:#aaa}
.allow.compact .al-mid b{font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;color:var(--ink2);white-space:nowrap}
.pill b{color:var(--ink)}
.pill.full{background:var(--black);border-color:var(--black);color:#ddd}.pill.full b{color:#fff}
.lb-cat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 8px 6px;border-bottom:1px solid var(--line2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.lb-cat-r{letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink2);font-size:12px}
.lb-cat.full .lb-cat-r b{background:var(--black);color:#fff;padding:1px 6px;border-radius:3px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.filters .search{width:170px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 14px;align-items:start}
.fl .input,.fl select,.fl textarea{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:400}
html,body{overflow-x:hidden}
.lb-close{display:none}
.pcard{text-align:left;display:block;width:100%}
.pcard .meta{padding:10px 2px 0}
.pcard .nm{font-size:14px;font-weight:500;line-height:1.25}
.pcard .cl{font-size:13px;color:var(--mute);margin-top:2px}
.pcard .av{font-size:12px;margin-top:6px;color:var(--ink2)}
.szs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.szs span{font-size:11px;line-height:1;padding:4px 6px;border:1px solid var(--line2);border-radius:3px;color:var(--ink2);font-weight:500}
.szs span.out{color:var(--line2);text-decoration:line-through;border-color:var(--line)}
.szs span.me{border-color:var(--black);background:var(--black);color:#fff}
.szs span.me.out{background:var(--tile2);color:var(--mute);border-color:var(--tile2)}
.filters.f2{margin-top:-8px}
.seg{display:inline-flex;border:1px solid var(--black);border-radius:999px;overflow:hidden}
.seg button{height:32px;padding:0 16px;font-size:13px;font-weight:500}
.seg button.on{background:var(--black);color:#fff}
.sizerow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1;min-width:0;padding:2px 0}
.sizerow::-webkit-scrollbar{display:none}
.sizerow .eyebrow{margin-right:4px;flex:none}
.chip.sm{height:30px;padding:0 11px;font-size:12px;flex:none}
.chip .op{opacity:.6;font-weight:400}
.pcard.out{opacity:.4}
.pcard .inlb{position:absolute;top:8px;right:8px}
.pcard:hover .ph{background:var(--tile2)}

/* Lookbook */
.lb-head{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.lb-list{flex:1;overflow:auto;padding:8px 12px}
.lb-foot{padding:14px 20px 20px;border-top:1px solid var(--line);display:grid;gap:8px;background:#fff}
.lbi{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 8px;border-bottom:1px solid var(--line)}
.lbi:last-child{border-bottom:0}
.lbi .ph{width:64px}
.lbi .nm{font-size:13px;font-weight:500;line-height:1.25}
.lbi .sub{font-size:12px;color:var(--mute)}
.lbi .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
.lb-toggle{display:none}

/* Sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:6px;width:min(920px,100%);max-height:calc(100vh - 40px);overflow:auto;position:relative}
.modal.narrow{width:min(440px,100%)}
.modal .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:#fff;font-size:20px;line-height:1;z-index:2}
.modal .x:hover{background:var(--tile)}
.pd{display:grid;grid-template-columns:1.1fr 1fr}
.pd .info{padding:36px 32px;display:flex;flex-direction:column;gap:16px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.size{height:46px;border:1px solid var(--line2);border-radius:var(--r);font-size:14px;font-weight:500;position:relative}
.size small{display:block;font-size:10px;color:var(--mute);font-weight:400;line-height:1}
.size.on{border-color:var(--black);background:var(--black);color:#fff}
.size.on small{color:#bbb}
.size.rec{border-color:var(--black)}
.size:disabled{color:var(--line2);background:var(--soft);cursor:not-allowed;text-decoration:line-through}
.mbody{padding:28px}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:80;box-shadow:0 6px 30px rgba(0,0,0,.18);max-width:90vw}

/* BOH */
.tabs{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.stat{border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.qcard{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.qhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:var(--soft)}
.qhead .n{font-size:18px;font-weight:600;letter-spacing:-.02em}
.rack{width:84px}
.qitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .ph{width:56px}
.qitem .nm{font-size:14px;font-weight:500;line-height:1.2}
.qitem .sub{font-size:12px;color:var(--mute)}
.qitem .sz{font-size:13px;font-weight:700;border:1px solid var(--black);border-radius:3px;padding:1px 7px;margin-left:4px}
.qitem.done{opacity:.4}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .ph{width:48px}
.tbl tr.cathead td{background:var(--soft);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* Admin */
.adm{display:grid;gap:18px}
.sec{border:1px solid var(--line);border-radius:4px;padding:22px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.form-grid label,.fl{display:grid;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.drop{border:1.5px dashed var(--line2);border-radius:4px;padding:26px;text-align:center;color:var(--mute);transition:all .15s}
.drop.over{border-color:var(--black);background:var(--soft);color:var(--ink)}
.drop b{color:var(--ink);font-weight:600}
.allocin{width:52px;text-align:center}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--black)}
.notice{background:var(--soft);border:1px solid var(--line);padding:14px 16px;border-radius:4px;font-size:13px;color:var(--ink2)}
.tblwrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:4px}
.tblwrap .tbl th{position:sticky;top:0;background:#fff;z-index:1}

@media (max-width:1050px){
  .shop{grid-template-columns:1fr}
  .shop-side{position:fixed;right:0;top:61px;width:min(400px,100%);z-index:40;transform:translateX(105%);transition:transform .25s}
  .shop-side.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
  .lb-close{display:inline-flex}
  .lb-toggle{display:flex;position:fixed;bottom:20px;right:20px;z-index:41}
  .queue{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
}
@media (max-width:700px){
  h1{font-size:34px}
  .top-in{padding:0 14px;gap:10px}
  .brand span{display:none}
  .logo-swoosh{height:32px}.logo-word{height:22px}
  .hero{gap:14px}
  .brand{flex:1;min-width:0}.brand b{overflow:hidden;text-overflow:ellipsis;font-size:15px}
  .nav{margin-left:0}.sync{display:none}.lang button{padding:5px 7px}
  .nav a{padding:7px 9px;font-size:12px}
  .wrap,.shop-main{padding:18px 14px 100px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pd{grid-template-columns:1fr}
  .pd .info{padding:22px}
  .filters .search{width:100%;margin-left:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .queue{grid-template-columns:1fr}
}
</style>
</head>

function sizeSort(a,b){
  const A=String(a).toUpperCase().trim(), B=String(b).toUpperCase().trim();
  const ia=SIZE_ORDER.indexOf(A.split(/[\s(]/)[0]), ib=SIZE_ORDER.indexOf(B.split(/[\s(]/)[0]);
  if(ia>-1&&ib>-1) return ia-ib;
  const na=parseFloat(A.replace(/[^0-9.]/g,"")), nb=parseFloat(B.replace(/[^0-9.]/g,""));
  if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
  if(ia>-1) return -1; if(ib>-1) return 1;
  return A.localeCompare(B);
}

function normGender(v){

  if(/(kid|nin[oa]s?|youth|junior|boys?|girls?|infant|toddler|\b(gs|ps|td|bb)\b|little|big kid)/.test(x)) return "kids";

  if(/(women|womens|woman|mujer|dama|female|\bwmns?\b|\bw\b|\bwm\b|femenin)/.test(x)) return "women";

}

function makeMockDB(){
  const store = new Map(); const subs = new Set();
  const notify = () => subs.forEach(s=>s());
  const colDocs = path => [...store.entries()].filter(([k])=>k.startsWith(path+"/") && k.slice(path.length+1).indexOf("/")===-1)
     .map(([k,v])=>({id:k.slice(path.length+1),exists:true,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}}));
  const docRef = path => ({ id:path.split("/").pop(), path,
    get: async()=>({id:path.split("/").pop(),exists:store.has(path),data:()=>store.get(path)}),
    set: async d=>{store.set(path,JSON.parse(JSON.stringify(d)));notify();},
    update: async d=>{ if(!store.has(path)) throw {code:"invalid_argument"}; const cur=store.get(path); const merge=(a,b)=>{for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object") merge(a[k],b[k]); else a[k]=b[k];} return a;}; store.set(path,merge(JSON.parse(JSON.stringify(cur)),JSON.parse(JSON.stringify(d))));notify();},
    delete: async()=>{store.delete(path);notify();},
    onSnapshot:(next)=>{const f=()=>{next({id:path.split("/").pop(),exists:store.has(path),data:()=>store.get(path),metadata:{fromCache:false}})};subs.add(f);setTimeout(f,30);return()=>subs.delete(f);}
  });
  return {
    doc: docRef,
    collection: path => ({ path, doc:id=>docRef(path+"/"+(id||rid())),
      get: async()=>{const d=colDocs(path);return {docs:d,size:d.length,empty:!d.length};},
      onSnapshot:(next)=>{const f=()=>{const d=colDocs(path);next({docs:d,size:d.length,empty:!d.length,metadata:{fromCache:false},docChanges:()=>[]})};subs.add(f);setTimeout(f,30);return()=>subs.delete(f);}
    })
  };
}

async function w(fn, label){
  for(let i=0;i<4;i++){
    try{ return await fn(); }
    catch(e){
      const c = e && e.code;
      if((c==="unavailable"||c==="resource_exhausted") && i<3){ await sleep(400*(i+1)+Math.random()*300); continue; }
      if(c==="invalid_argument" && !S.readOnly){ /* may be permission */ }
      if(c==="quota_exceeded"){ toast(e.message||"Storage full"); throw e; }
      console.warn("write failed", label, e); toast((label?label+": ":"")+(e && (e.message||e.code) || "error")); throw e;
    }
  }
}

function doRender(){
  if(isEditing()){ pendingRender=true; return; }
  pendingRender=false;
  const a = document.activeElement; const focusId = a && a.id; let sel=null;
  try{ if(a && a.selectionStart!=null) sel=[a.selectionStart,a.selectionEnd]; }catch(e){}
  const scrolls = {}; document.querySelectorAll("[data-scroll]").forEach(el=>scrolls[el.dataset.scroll]=el.scrollTop);

}

const TAPE_DUR=240, TAPE_GAP=75;
// Builds the duct-tape wordmark, each strip of tape "laid down" in sequence. elapsed (ms) keeps the
// animation continuous across re-renders; after it finishes, the static wordmark is shown.
function tapeLogoHTML(elapsed, cls){
  let t=200; const pt=p=>p[0]+"% "+p[1]+"%";
  const parts=[];
  TAPE.boxes.forEach((bx,k)=>{
    let inner="";
    TAPE.strips[k].forEach(q=>{
      const a="polygon("+[q[0],q[1],q[1],q[0]].map(pt).join(",")+")", b="polygon("+q.map(pt).join(",")+")";
      inner+='<img class="ts" src="assets/tape/L'+k+'.webp" alt="" style="--a:'+a+';--b:'+b+';animation-delay:'+(t-elapsed)+'ms">';
      t+=TAPE_GAP;
    });
    const fillAt=t-TAPE_GAP+TAPE_DUR; t+=30;
    inner+='<img class="tf" src="assets/tape/L'+k+'.webp" alt="" style="animation-delay:'+(fillAt-elapsed)+'ms">';
    parts.push('<div class="tl" style="left:'+bx[0]+'%;top:'+bx[1]+'%;width:'+bx[2]+'%;height:'+bx[3]+'%">'+inner+'</div>');
  });
  const total=t+TAPE_DUR+400;
  if(elapsed>total) return '<img class="'+cls+'" src="assets/seeding-suite-wordmark.webp" alt="Seeding Suite" data-act="replayLogo">';
  return '<div class="tape-logo '+cls+'" style="aspect-ratio:'+TAPE.ar[0]+'/'+TAPE.ar[1]+'" role="img" aria-label="Seeding Suite" data-act="replayLogo">'+parts.join("")+'</div>';
}

function lookbookHTML(g, ps){
  const drafts = ps.filter(p=>p.status==="draft").length;
  const pending = ps.filter(p=>p.status==="requested"||p.status==="pulled").length;
  const pulled = ps.filter(p=>p.status==="pulled").length;
  const alloc = allocOf(g), used = usedOf(g.id);
  let h = '<div class="lb-head"><div class="row"><h2>'+esc(t("lookbook"))+'</h2><span class="spacer"></span>'+(g.rack?'<span class="badge solid">'+esc(t("rack"))+' '+esc(g.rack)+'</span>':'')+
          '<button class="btn ghost xs lb-close" data-act="toggleLb" style="margin-left:6px">✕</button></div>'+
          '<p class="small muted" style="margin-top:6px">'+esc(pulled?t("pendingDecision"):t("lbHelp"))+'</p></div>';
  h += '<div class="lb-list" data-scroll="lb">';
  if(!ps.length) h += '<div class="empty small">'+esc(t("lookbookEmpty"))+'</div>';
  const order = {pulled:0,kept:1,draft:2,requested:3,unavailable:4,returned:5};
  CATS.forEach(c=>{
    const items = ps.filter(p=>p.cat===c).sort((a,b)=>(order[a.status]-order[b.status])||((a.createdAt||0)-(b.createdAt||0)));
    if(!items.length) return;
    const left = Math.max(0,alloc[c]-used[c]);
    h += '<div class="lb-cat'+(used[c]>=alloc[c]?" full":"")+'"><span>'+esc(t(c))+'</span><span class="lb-cat-r"><b>'+used[c]+' / '+alloc[c]+'</b> '+esc(t("takeHome"))+' · '+(left?left+' '+esc(t("leftToTake")):esc(t("allTaken")))+'</span></div>';
    items.forEach(pk=>{
      const p = S.products[pk.sku] || {sku:pk.sku,name:t("unknownProduct"),category:pk.cat};
      let acts = statusBadge(pk.status);
      if(pk.status==="draft"||pk.status==="unavailable") acts += '<button class="link" data-act="removePick" data-id="'+esc(pk.id)+'">'+esc(t("remove"))+'</button>';
      if(pk.status==="pulled") acts = keepBtns(pk);
      if(pk.gift){ acts = '<span class="badge solid">'+esc(t("giftBadge"))+'</span>'; }
      else if((pk.status==="kept"||pk.status==="returned") && !g.completedAt) acts += '<button class="link" data-act="setPick" data-id="'+esc(pk.id)+'" data-v="pulled">'+esc(t("undo"))+'</button>';
      h += '<div class="lbi" style="'+(pk.status==="returned"?"opacity:.45":"")+'">'+imgHTML(p)+'<div><div class="nm">'+esc(p.name)+'</div><div class="sub">'+esc(p.color||"")+' · '+esc(t("size"))+' '+esc(pk.size)+'</div><div class="acts">'+acts+'</div></div></div>';
    });
  });
  h += '</div><div class="lb-foot">';
  h += '<button class="btn block" data-act="submitLb" '+(drafts?"":"disabled")+'>'+esc(t("sendStylists"))+(drafts?' ('+drafts+')':'')+'</button>';
  h += '<button class="btn ghost block" data-act="finishGuest" '+(ps.length && !drafts && !pending ? "" : "disabled")+'>'+esc(t("finish"))+'</button>';
  h += '</div>';
  return h;
}

function bohHTML(){
  const gs = sortedGuests();

  const req = allPicks.filter(p=>p.status==="requested");
  const pulled = allPicks.filter(p=>p.status==="pulled");
  const kept = allPicks.filter(p=>p.status==="kept");
  const fittingGuests = gs.filter(g=>!g.completedAt && picksOf(g.id).some(p=>p.status==="pulled"||p.status==="kept"||p.status==="returned"));
  const doneGuests = gs.filter(g=>g.completedAt);
  let h = '<div class="wrap"><div class="row" style="align-items:flex-end;flex-wrap:wrap"><div><div class="eyebrow">'+esc(S.config.eventName||"")+'</div><h1 style="margin-top:6px">'+esc(t("boh"))+'</h1></div></div>';

  const tabs = [["pull",t("toPull"),new Set(req.map(p=>p.guestId)).size],["pick",t("pickList"),req.length],["fit",t("fitting"),fittingGuests.length],["done",t("completed"),doneGuests.length]];
  h += '<div class="tabs">'+tabs.map(([k,l,n])=>'<button class="chip '+(S.bohTab===k?"on":"")+'" data-act="bohTab" data-v="'+k+'">'+esc(l)+' · '+n+'</button>').join("")+'</div>';

      const firstReq = Math.min(...items.filter(p=>p.status==="requested").map(p=>p.requestedAt||now()));
      return '<div class="qcard">'+bohGuestHead(g, '<span class="small muted">'+esc(t("requestedAgo"))+' '+esc(ago(firstReq))+'</span>')+
        items.map(pk=>bohItem(pk, pk.status==="requested"
          ? '<button class="btn xs" data-act="setPick" data-id="'+esc(pk.id)+'" data-v="pulled">'+esc(t("pulled"))+'</button><button class="btn ghost xs" data-act="setPick" data-id="'+esc(pk.id)+'" data-v="unavailable">'+esc(t("na"))+'</button>'
          : statusBadge(pk.status)+' <button class="link" data-act="setPick" data-id="'+esc(pk.id)+'" data-v="requested">'+esc(t("undo"))+'</button>', pk.status!=="requested")).join("")+
        '<div style="padding:12px 16px;border-top:1px solid var(--line)"><button class="btn sm block" data-act="pullAll" data-id="'+esc(gid)+'">'+esc(t("markAllPulled"))+'</button></div></div>';
    }).join("")+'</div>';
  }
  if(S.bohTab==="pick"){

/* ============ Modals ============ */
function openModal(m){ S.modal=m; renderModal(); }
function closeModal(){ S.modal=null; renderModal(); }
function renderModal(){
  const root = $("#modal-root"); const m = S.modal;
  if(!m){ root.innerHTML=""; root.dataset.key=""; return; }
  // keep modal content stable while typing
  if(root.firstChild && root.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  let inner="", narrow=false;
  if(m.type==="product") inner = productModalHTML(m.id);
  else if(m.type==="confirm"){ narrow=true; inner='<div class="mbody"><h3 style="margin:6px 30px 20px 0">'+esc(m.text)+'</h3><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-act="closeModal">'+esc(t("cancel"))+'</button><button class="btn sm" data-act="confirmYes">'+esc(t("confirm"))+'</button></div></div>'; }
  else if(m.type==="pin"){ narrow=true; inner='<div class="mbody"><h3 style="margin-bottom:14px">'+esc(t("enterPin"))+'</h3><input class="input" id="pin-in" type="password" inputmode="numeric" autocomplete="off" style="font-size:22px;letter-spacing:.3em;text-align:center"><p class="small" id="pin-err" style="height:18px;margin-top:6px"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-act="pinCancel">'+esc(t("cancel"))+'</button><button class="btn sm" data-act="pinOk">'+esc(t("unlock"))+'</button></div></div>'; }
  else if(m.type==="editProduct") inner = editProductHTML(m.id);
  else if(m.type==="editGuest"){ narrow=true; inner = editGuestHTML(m.id); }
  else if(m.type==="swap"){ narrow=true; inner = swapHTML(m.id); }
  else if(m.type==="result"){ narrow=true; inner='<div class="mbody"><h3 style="margin-bottom:12px">'+esc(m.title)+'</h3><div class="small" style="white-space:pre-wrap;max-height:50vh;overflow:auto">'+esc(m.text)+'</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn sm" data-act="closeModal">OK</button></div></div>'; }
  if(!inner){ S.modal=null; root.innerHTML=""; return; }
  const keep={}; root.querySelectorAll("input[id],select[id],textarea[id]").forEach(el=>{ keep[el.id]= el.type==="checkbox"?el.checked:el.value; });
  const sameModal = root.dataset.key===(m.type+":"+(m.id||"")); root.dataset.key=m.type+":"+(m.id||"");
  root.innerHTML = '<div class="scrim" data-act="scrim"><div class="modal '+(narrow?"narrow":"")+'" role="dialog"><button class="x" data-act="closeModal" aria-label="Close">×</button>'+inner+'</div></div>';
  if(sameModal) Object.keys(keep).forEach(id=>{ const el=document.getElementById(id); if(el && el.type!=="file"){ if(el.type==="checkbox") el.checked=keep[id]; else el.value=keep[id]; } });
  if(m.type==="pin") setTimeout(()=>{ const i=$("#pin-in"); i&&i.focus(); },30);
}

async function prepImage(file){
  try{
    const bmp = await createImageBitmap(file);
    const max=1000, sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    const x=c.getContext("2d"); x.fillStyle="#f5f5f5"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.88));
  }catch(e){ return file; }
}

async function bulkImages(files){
  if(!S.assets){ toast(t("noAssets")); return; }
  const prods = Object.values(S.products);
  const keyed = prods.map(p=>({p,k:skuKey(p.sku)})).sort((a,b)=>b.k.length-a.k.length);
  let ok=0; const miss=[];
  S.busy={label:t("images"),done:0,total:files.length}; render();
  for(const f of files){
    const base = skuKey(f.name.replace(/\.[^.]+$/,""));
    const hit = keyed.find(x=>x.k && (base===x.k || base.startsWith(x.k)));
    if(hit){ try{ const blob=await prepImage(f); const a=await S.assets.upload(blob); await w(()=>pDoc(hit.p.id).update({imageId:a.id})); ok++; }catch(e){ miss.push(f.name); } }
    else miss.push(f.name);
    S.busy.done++; render();
  }
  S.busy=null; render();
  openModal({type:"result",title:t("images"),text:ok+" "+t("matched")+(miss.length?"\n"+miss.length+" "+t("unmatched")+":\n"+miss.join("\n"):"")});
}

function catFromText(txt){
  const x = String(txt||"");
  if(/(shoe|sneaker|tenis|zapat|boot|slide|sandal|cleat|trainer|running shoe|dunk|air max|air force|jordan \d|pegasus|vomero)/i.test(x) && !/(sock|calcet)/i.test(x)) return "footwear";
  if(/(hood|sudadera|crew|sweatshirt|pullover)/i.test(x)) return "hoodies";
  if(/(jacket|chamarra|chaqueta|vest|chaleco|windrunner|parka|coat|anorak|puffer|full-zip|full zip)/i.test(x)) return "jackets";
  if(/(pant|short|jogger|legging|tight|pantal|skirt|falda|bottom)/i.test(x)) return "bottoms";
  if(/(cap|hat|gorra|bag|backpack|mochila|sock|calcet|glove|headband|beanie|bottle|ball|balon|belt|visor|sleeve)/i.test(x)) return "accessories";
  if(/(top|tee|t-shirt|shirt|playera|polo|jersey|tank|bra|long-sleeve|long sleeve|crop)/i.test(x)) return "tops";
  return "";
}
const needsInfo = p => !p.name || norm(p.name)===norm(p.sku);
const needsLookup = p => needsInfo(p) || !p.gender;
// Fills in missing product names (and colorway/category) and missing images from nike.com, 4 products at a time.
async function fetchNikeImages(only, prefix){
  const list = (only||Object.values(S.products).filter(p=>!p.imageId || needsLookup(p)));
  if(!list.length) return;
  let ok=0, named=0; const miss=[];
  S.busy={label:t("fetchNike"),done:0,total:list.length}; render();
  const queue = list.slice();
  async function worker(){
    while(queue.length){
      const p0 = queue.shift(); const p = S.products[p0.id] || p0;
      if(needsLookup(p)){ const fullInfo = needsInfo(p);
        try{
          const r = await fetch("/api/nike-info?sku="+encodeURIComponent(p.sku));
          if(r.ok){ const info = await r.json();
            const name = info.name && info.subtitle && !info.name.toLowerCase().includes(info.subtitle.toLowerCase()) ? info.name+" — "+info.subtitle : info.name;
            const patch = {};
            const gd = normGender((info.subtitle||"")+" "+info.name); if(gd) patch.gender = gd; else if(!p.gender) patch.gender = "unisex";
            if(fullInfo){ patch.name=name; if(info.color) patch.color = info.color;
              const c = catFromText(info.name+" "+(info.subtitle||"")); if(c) patch.category = c; named++; }
            await w(()=>pDoc(p.id).update(patch)); }
        }catch(e){}
      }
      if(!p.imageId && S.assets){
        try{
          const r = await fetch("/api/nike-image?sku="+encodeURIComponent(p.sku));
          if(!r.ok) throw new Error(r.status);
          const blob = await r.blob();
          const prepped = await prepImage(blob);
          const a = await S.assets.upload(prepped);
          await w(()=>pDoc(p.id).update({imageId:a.id}));
          ok++;
        }catch(e){ miss.push(p.sku); }
      }
      S.busy.done++; render();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.busy=null; render();
  openModal({type:"result",title:prefix?t("imported"):t("fetchNike"),text:(prefix?prefix+"\n\n":"")+t("namesLbl")+": "+named+"\n"+t("images")+": "+ok+" "+t("found")+(miss.length?"\n"+miss.length+" "+t("notFound")+":\n"+miss.join("\n"):"")});
}

function mapHeaders(headers, fields){
  const map={}; const nh=headers.map(norm);
  for(const f in fields){ const i = nh.findIndex(h=>fields[f].includes(h)); if(i>-1) map[f]=headers[i]; }
  return map;
}
const FUZZY = {
  sku:["sku","stylecolor","stylecolour","style","material","article","codigo","modelo","upc"],
  name:["productname","description","descripcion","name","nombre","producto"],
  category:["category","categoria","division","productline","type","tipo"],

  size:["size","talla"],
  qty:["qty","quantity","cantidad","units","unidades","stock","inventory","onhand","piezas","pcs"],
};
function mapHeadersFuzzy(headers, fields, fuzzy){
  const m = mapHeaders(headers, fields);
  if(!fuzzy) return m;
  const nh = headers.map(norm); const used = new Set(Object.values(m));
  for(const f in fuzzy){ if(m[f]) continue;
    for(const k of fuzzy[f]){ const i = nh.findIndex((h,ix)=>h && h.includes(k) && !used.has(headers[ix])); if(i>-1){ m[f]=headers[i]; used.add(headers[i]); break; } } }
  return m;
}
const SIZE_HDR = /^(XXXS|3XS|XXS|2XS|XS|S|M|L|XL|XXL|2XL|XXXL|3XL|4XL|5XL|OS|O\/S|ONE ?SIZE|MISC|TU|UNI|\d{1,2}(\.5)?[CYK]?|\d{2}(\.5)?\s?(CM|MX|EU)?)$/i;
const isSizeHeader = h => SIZE_HDR.test(String(h).trim());
// Reads the first sheet that has a recognisable header row (which may be below title/blank rows).
async function readSheet(file, fields, fuzzy, keyField){
  if(!window.XLSX) throw new Error("Excel library didn't load");
  const wb = XLSX.read(await file.arrayBuffer(),{type:"array"});
  let firstSeen = null;
  for(const n of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false,blankrows:false});
    if(!aoa.length) continue;
    if(!firstSeen) firstSeen = aoa.slice(0,5).map(r=>r.filter(String).join(" | ")).join("\n");
    for(let i=0;i<Math.min(aoa.length,40);i++){
      const hdr = aoa[i].map((v,j)=>{ const x=String(v).trim(); return x || ("col"+(j+1)); });
      // make duplicate headers unique
      const seen={}; hdr.forEach((h,j)=>{ if(seen[h]) hdr[j]=h+" ("+(++seen[h])+")"; else seen[h]=1; });
      const m = mapHeadersFuzzy(hdr, fields, fuzzy);
      if(!m[keyField]) continue;
      const rows = aoa.slice(i+1).map(r=>{ const o={}; hdr.forEach((h,j)=>o[h]=r[j]==null?"":r[j]); return o; })
                       .filter(o=>Object.values(o).some(v=>String(v).trim()!==""));
      return {rows, headers:hdr, map:m, sheet:n, headerRow:i+1};
    }
  }
  const e = new Error("NO_HEADER"); e.preview = firstSeen||""; throw e;
}
async function doImport(kind){
  const id = kind==="inv"?"imp-inv":"imp-guest";
  const file = $("#"+id+"-file").files[0]; const mode=$("#"+id+"-mode").value;
  if(!file){ toast(t(kind==="inv"?"inventoryFile":"guestFile")+"?"); return; }
  let res;
  try{ res = kind==="inv" ? await readSheet(file, INV_FIELDS, FUZZY, "sku") : await readSheet(file, GUEST_FIELDS, {name:["name","nombre","guest","talent","invitado"]}, "name"); }
  catch(e){
    const need = kind==="inv" ? "a column named SKU (or Style / Style Color / Código)" : "a column named Name (or Nombre)";
    openModal({type:"result",title:"Error",text: e.message==="NO_HEADER" ? ("Couldn't find "+need+" in the first 40 rows of any sheet.\n\nTop of your file:\n"+e.preview+"\n\nTip: download the template from this page to see the expected columns.") : e.message});
    return;
  }
  if(!res.rows.length){ openModal({type:"result",title:"Error",text:"No data rows under the header."}); return; }
  if(kind==="inv") await importInventory(res, mode); else await importGuests(res.rows, res.headers, mode);
}
async function importInventory(res, mode){
  const {rows, headers, map:m} = res;
  // Wide layout: one row per SKU, sizes as columns (e.g. S | M | L or 8 | 8.5 | 9) holding quantities.
  const sizeCols = m.size ? [] : headers.filter(h=>isSizeHeader(h) && !Object.values(m).includes(h));
  const wide = !m.size && sizeCols.length>=1 && (!m.qty || sizeCols.length>=2);
  const agg={}; let skipped=0;
  rows.forEach(r=>{
    const sku=String(r[m.sku]||"").trim(); if(!sku || /^total/i.test(sku)){ skipped++; return; }
    const id=docId(sku);
    const a = agg[id] || (agg[id]={sku, name:"", color:"", category:"", sizes:{}});
    if(m.name && r[m.name]) a.name = String(r[m.name]).trim();
    if(m.color && r[m.color]) a.color = String(r[m.color]).trim();
    if(m.gender && r[m.gender]) a.gender = normGender(r[m.gender]);
    if(m.category && r[m.category]){
      const cn = norm(r[m.category]);
      // generic divisions (APP / Apparel / Ropa) → work out tops/bottoms/jackets/hoodies from the product name
      a.category = ["app","apparel","ropa","textil","textiles","apparal"].includes(cn) ? (/(hood|sudadera|fleece|crew|sweat)/i.test(a.name)?"hoodies":/(jacket|chamarra|chaqueta|vest|chaleco|windrunner|parka|coat|anorak)/i.test(a.name)?"jackets":/(pant|short|jogger|legging|tight|pantal|skirt|falda)/i.test(a.name)?"bottoms":"tops") : normCat(r[m.category]);
    } else if(!a.category && a.name){ const g=normCat(a.name); if(g!=="accessories") a.category=g; }
    if(wide){
      sizeCols.forEach(h=>{ const q=parseInt(String(r[h]).replace(/[^0-9-]/g,""),10); if(!isNaN(q) && q>0) a.sizes[h.toUpperCase()]=(a.sizes[h.toUpperCase()]||0)+q; });
    } else {
      const size = m.size ? String(r[m.size]||"").trim() : ""; const sz = size || "OS";
      const q = m.qty ? parseInt(String(r[m.qty]).replace(/[^0-9-]/g,""),10) : 1;
      a.sizes[sz] = (a.sizes[sz]||0) + (isNaN(q)?0:Math.max(0,q));
    }
  });
  if(wide) m.sizes = sizeCols.join(", ");
  const ids = Object.keys(agg);
  const toDelete = mode==="replace" ? Object.keys(S.products).filter(i=>!agg[i]) : [];
  S.busy={label:t("importing"),done:0,total:ids.length+toDelete.length}; render();
  for(const id of ids){
    const a=agg[id], prev=S.products[id]||{};
    const doc={gender:a.gender||prev.gender||normGender(a.name), sku:a.sku, name:a.name||prev.name||a.sku, color:a.color||prev.color||"", category:a.category||prev.category||normCat(a.name), sizes:a.sizes, imageId:prev.imageId||null, updatedAt:now()};
    await w(()=>pDoc(id).set(doc),"import"); S.busy.done++; if(S.busy.done%5===0) render();
  }
  for(const id of toDelete){ await w(()=>pDoc(id).delete()); S.busy.done++; }
  S.busy=null; render();
  const summary = ids.length+" SKUs · "+Object.values(agg).reduce((a,x)=>a+Object.values(x.sizes).reduce((b,c)=>b+c,0),0)+" units"+(skipped?" · "+skipped+" "+t("rowsSkipped"):"")+(toDelete.length?"\n− "+toDelete.length+" SKUs":"")+"\nColumns used: "+Object.entries(m).map(([k,v])=>k+" ← "+v).join(", ");
  const newOnes = ids.map(i=>({...(S.products[i]||{}),id:i,sku:agg[i].sku,name:(S.products[i]||{}).name||agg[i].name,gender:(S.products[i]||{}).gender||agg[i].gender||normGender(agg[i].name)})).filter(p=>!p.imageId || needsLookup(p));
  if(S.sb && newOnes.length){ await fetchNikeImages(newOnes.map(p=>({...p,id:p.id||docId(p.sku)})), summary); return; }
  openModal({type:"result",title:t("imported"),text:summary});
}
async function importGuests(rows, headers, mode){
  const m = mapHeaders(headers, GUEST_FIELDS);
  if(!m.name){ openModal({type:"result",title:"Error",text:"No Name column found. Columns: "+headers.join(", ")}); return; }
  const byName={}; Object.values(S.guests).forEach(g=>byName[norm(g.name)]=g.id);
  const seen=new Set(); let skipped=0; const work=[];
  rows.forEach(r=>{
    const name=String(r[m.name]||"").trim(); if(!name){ skipped++; return; }
    const id = byName[norm(name)] || rid(); seen.add(id);
    const prev = S.guests[id] ? {...S.guests[id]} : {createdAt:now()}; delete prev.id;
    const alloc = {...(prev.alloc||{})};
    CATS.forEach(c=>{ if(m[c]!=null && String(r[m[c]]).trim()!==""){ const v=parseInt(r[m[c]],10); if(!isNaN(v)) alloc[c]=Math.max(0,v); } });
    const doc={...prev,name,alloc};
    ["role","topSize","bottomSize","shoeSize","notes"].forEach(f=>{ if(m[f]) doc[f]=String(r[m[f]]||"").trim(); else if(doc[f]==null) doc[f]=""; });
    if(m.gender) doc.gender = normGender(r[m.gender]);
    work.push([id,doc]);
  });
  const toDelete = mode==="replace" ? Object.keys(S.guests).filter(i=>!seen.has(i)) : [];
  S.busy={label:t("importing"),done:0,total:work.length+toDelete.length}; render();
  for(const [id,doc] of work){ await w(()=>gDoc(id).set(doc),"import"); S.busy.done++; if(S.busy.done%5===0) render(); }
  for(const id of toDelete){ for(const p of picksOf(id)) await w(()=>kDoc(p.id).delete()); await w(()=>gDoc(id).delete()); S.busy.done++; }
  S.busy=null; render();
  openModal({type:"result",title:t("imported"),text:work.length+" "+t("guestsLbl").toLowerCase()+(skipped?" · "+skipped+" "+t("rowsSkipped"):"")+(toDelete.length?"\n− "+toDelete.length:"")+"\n\nColumns used: "+Object.entries(m).map(([k,v])=>k+" ← "+v).join(", ")});
}
async function saveWorkbook(wb, filename){
  const out = XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

  sortedGuests().forEach(g=>picksOf(g.id).filter(p=>p.status!=="draft").forEach(pk=>{ const p=S.products[pk.sku]||{}; take.push([g.name,g.role||"",g.rack||"",T.en[pk.cat]||pk.cat,p.sku||pk.sku,p.name||"",p.color||"",pk.size,(pk.gift?"Gift (hand-out)":(T.en["st_"+pk.status]||pk.status))]); }));
  XLSX.utils.book_append_sheet(wb, sheet(take,[22,16,8,12,14,30,16,8,14]),"Take-home");

  const inv=[["SKU","Product","Category","Color","Size","Stock","Reserved","Kept","Available"]];
  sortedProducts().forEach(p=>Object.keys(p.sizes||{}).sort(sizeSort).forEach(s=>{ const k=p.id+"|"+s; inv.push([p.sku,p.name,T.en[p.category],p.color||"",s,p.sizes[s]||0,res[k]||0,kept[k]||0,availOf(p,s,res)]); }));
  XLSX.utils.book_append_sheet(wb, sheet(inv,[14,30,12,16,8,8,9,8,10]),"Inventory");

  XLSX.utils.book_append_sheet(wb, sheet(sum,[22,16,12,16,12,14,14,14,18]),"Guests");
  const d=new Date(); await saveWorkbook(wb, "seeding-report-"+d.toISOString().slice(0,10)+".xlsx");

/* ============ Boot ============ */
function subscribe(){
  const timer = setTimeout(()=>{ S.loadTimedOut=true; render(); },10000);
  const onErr = e => { console.warn("db",e); S.dbFailed=true; S.connected=false; render(); };
  const coll = (name, target) => S.db.collection(name).onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{ if(d.exists) o[d.id]={id:d.id,...d.data()}; });
    S[target]=o; if(!snap.metadata || !snap.metadata.fromCache){ S.connected=true; clearTimeout(timer); }
    render();
  }, onErr);
  coll("products","products"); coll("guests","guests"); coll("picks","picks");
  cfgDoc().onSnapshot(d=>{ const v=d.exists?d.data():{}; S.config={...DEFAULT_CONFIG,...v,alloc:{...DEFAULT_CONFIG.alloc,...(v.alloc||{})}}; render(); }, onErr);
}
/* ============ Supabase adapter (same doc/collection API the app uses) ============ */
const TABLES = ["products","guests","picks","config"];
function deepMerge(a,b){ const o=Array.isArray(a)?a.slice():{...(a||{})}; for(const k in b){ const v=b[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])) o[k]=deepMerge(o[k],v); else o[k]=v; } return o; }
function makeSupaDB(sb){
  const cache = {}; TABLES.forEach(tb=>cache[tb]=new Map());
  const listeners = {}; TABLES.forEach(tb=>listeners[tb]=new Set());
  const emit = tb => { const docs=[...cache[tb].entries()].map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));
    listeners[tb].forEach(f=>f({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:()=>[]})); };
  const fail = e => { const err = new Error(e.message||String(e)); err.code = /rate|429/.test(e.message||"")?"resource_exhausted":"unavailable"; return err; };
  const loaded = {};
  async function load(tb){
    let from=0; const step=1000; const all=[];
    for(;;){ const {data,error}=await sb.from(tb).select("id,data").range(from,from+step-1); if(error) throw fail(error); all.push(...data); if(data.length<step) break; from+=step; }
    cache[tb].clear(); all.forEach(r=>cache[tb].set(r.id,r.data||{})); loaded[tb]=true; emit(tb);
  }
  const channel = sb.channel("seeding-suite");
  TABLES.forEach(tb=>channel.on("postgres_changes",{event:"*",schema:"public",table:tb},payload=>{
    if(payload.eventType==="DELETE"){ cache[tb].delete(payload.old.id); }
    else cache[tb].set(payload.new.id, payload.new.data||{});
    emit(tb);
  }));
  channel.subscribe(status=>{ if(status==="SUBSCRIBED"){ TABLES.forEach(tb=>{ if(listeners[tb].size) load(tb).catch(console.warn); }); } });
  // light safety net: refresh every 60s in case a realtime message was missed
  setInterval(()=>TABLES.forEach(tb=>{ if(listeners[tb].size && document.visibilityState==="visible") load(tb).catch(()=>{}); }),60000);
  const docRef = path => {
    const [tb,id] = path.split("/");
    return { id, path,
      get: async()=>{ const {data,error}=await sb.from(tb).select("data").eq("id",id).maybeSingle(); if(error) throw fail(error); return {id,exists:!!data,data:()=>data&&data.data}; },
      set: async d=>{ const body=JSON.parse(JSON.stringify(d)); cache[tb].set(id,body); emit(tb);
        const {error}=await sb.from(tb).upsert({id,data:body,updated_at:new Date().toISOString()}); if(error) throw fail(error); },
      update: async d=>{ const {data,error}=await sb.from(tb).select("data").eq("id",id).maybeSingle(); if(error) throw fail(error);
        if(!data){ const e=new Error("missing"); e.code="invalid_argument"; throw e; }
        const body=deepMerge(data.data||{},JSON.parse(JSON.stringify(d))); cache[tb].set(id,body); emit(tb);
        const r=await sb.from(tb).update({data:body,updated_at:new Date().toISOString()}).eq("id",id); if(r.error) throw fail(r.error); },
      delete: async()=>{ cache[tb].delete(id); emit(tb); const {error}=await sb.from(tb).delete().eq("id",id); if(error) throw fail(error); },
      onSnapshot:(next,err)=>{ const f=snap=>{ const d=snap.docs.find(x=>x.id===id); next({id,exists:!!d,data:()=>d&&d.data(),metadata:{fromCache:false}}); };
        listeners[tb].add(f); if(loaded[tb]) emit(tb); else load(tb).catch(e=>err&&err(e)); return ()=>listeners[tb].delete(f); }
    };
  };
  return {
    doc: docRef,
    collection: tb => ({ path:tb, doc:id=>docRef(tb+"/"+(id||rid())),
      onSnapshot:(next,err)=>{ listeners[tb].add(next); if(loaded[tb]) emit(tb); else load(tb).catch(e=>err&&err(e)); return ()=>listeners[tb].delete(next); } })
  };
}
function makeSupaAssets(sb){
  return { upload: async blob=>{
    const path = new Date().toISOString().slice(0,10)+"/"+rid()+".jpg";
    const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:blob.type||"image/jpeg", cacheControl:"31536000", upsert:false});
    if(error) throw new Error(error.message);
    return {id:path, url:imageUrl(path)};
  }};
}
function startData(){
  S.db = makeSupaDB(S.sb); S.assets = makeSupaAssets(S.sb);
  subscribe(); render();
  setTimeout(()=>{ if(S.view!=="guest" && S.config.pin && !S.unlocked){ const v=S.view; S.view="guest"; history.replaceState(null,"","#guest"); go(v); } },1500);
}
async function boot(){
  document.documentElement.lang=LANG;
  const h=(location.hash||"").replace("#","");
  S.view = h==="back-of-house"?"boh":h==="admin"?"admin":"guest";
  render();
  let cfg=null;
  try{ const r=await fetch("/api/config",{cache:"no-store"}); if(r.ok) cfg=await r.json(); }catch(e){}
  if(!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase){
    // Local demo mode: no backend configured (e.g. opened as a file). Data lives in this tab only.
    S.local=true; S.db=makeMockDB(); S.connected=true;
    S.assets={upload:async b=>{ const u=URL.createObjectURL(b); return {id:"local:"+u,url:u}; }};
    subscribe(); return;
  }
  S.cfg=cfg;
  S.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {auth:{persistSession:true,autoRefreshToken:true}});
  const {data} = await S.sb.auth.getSession();
  if(!data || !data.session){ S.needLogin=true; render(); return; }
  startData();
}
boot();
